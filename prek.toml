# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-yaml" },
  { id = "check-toml" },
]

[[repos]]
repo = "https://github.com/tombi-toml/tombi-pre-commit"
rev = "v1.2.4"
hooks = [
  { id = "tombi-lint", exclude = { glob = "**/uv.lock" } },
  { id = "tombi-format", exclude = { glob = "**/uv.lock" } },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "ruff-format",
    name = "ruff format",
    entry = "uv run ruff format",
    language = "system",
    types = ["python"],
    priority = 0,
  },
  {
    id = "ruff-check",
    name = "ruff check",
    entry = "uv run ruff check --fix",
    language = "system",
    types = ["python"],
    priority = 10,
  },
  {
    id = "ty-check",
    name = "ty check",
    entry = "uvx ty check",
    language = "system",
    types = ["python"],
    pass_filenames = false,
    priority = 20,
  },
]
