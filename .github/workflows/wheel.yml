name: wheel

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "**.md"
    tags:
      - "*"
  schedule:
    # UTC の 01:00 は JST だと 10:00 。
    # 1-5 で 月曜日から金曜日
    - cron: "0 1 * * 1-5"

permissions:
  contents: write

jobs:
  build_ubuntu:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: ubuntu-24.04_x86_64
            runs_on: ubuntu-24.04
          - name: ubuntu-24.04_armv8
            runs_on: ubuntu-24.04-arm
        python_version:
          - "3.14"
          - "3.14t"
    runs-on: ${{ matrix.platform.runs_on }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          python-version: ${{ matrix.python_version }}

      - name: Install Bazelisk
        run: |
          # 標準 Ubuntu リポジトリに bazelisk パッケージは無いため、GitHub releases
          # からランナーアーキテクチャに合ったバイナリを取得してインストールする。
          case "${{ runner.arch }}" in
            X64) bazelisk_arch=amd64 ;;
            ARM64) bazelisk_arch=arm64 ;;
            *) echo "unsupported runner.arch: ${{ runner.arch }}" && exit 1 ;;
          esac
          curl -fsSL -o /tmp/bazelisk "https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-${bazelisk_arch}"
          sudo install -m 0755 /tmp/bazelisk /usr/local/bin/bazelisk

      - name: Cache Bazel
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel
          key: ${{ runner.os }}-bazel-${{ matrix.platform.name }}-python-${{ matrix.python_version }}-${{ hashFiles('deps.json', 'BUILD.bazel', 'src/bindings/**') }}
          restore-keys: |
            ${{ runner.os }}-bazel-${{ matrix.platform.name }}-python-${{ matrix.python_version }}-
            ${{ runner.os }}-bazel-${{ matrix.platform.name }}-

      - name: Build wheel
        run: uv build --wheel

      - name: Repair wheel with auditwheel
        shell: bash
        run: |
          uvx auditwheel repair dist/*.whl --strip --only-plat

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.platform.name }}_python-${{ matrix.python_version }}
          path: wheelhouse/*.whl

  build_macos:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macos-26_arm64
            runs_on: macos-26
        python_version:
          - "3.14"
          - "3.14t"
    runs-on: ${{ matrix.platform.runs_on }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          python-version: ${{ matrix.python_version }}

      - name: Install Bazelisk
        run: brew install bazelisk

      - name: Cache Bazel
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bazel
          key: ${{ runner.os }}-bazel-${{ matrix.platform.name }}-python-${{ matrix.python_version }}-${{ hashFiles('deps.json', 'BUILD.bazel', 'src/bindings/**') }}
          restore-keys: |
            ${{ runner.os }}-bazel-${{ matrix.platform.name }}-python-${{ matrix.python_version }}-
            ${{ runner.os }}-bazel-${{ matrix.platform.name }}-

      - name: Build wheel
        run: uv build --wheel --out-dir wheelhouse

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.platform.name }}_python-${{ matrix.python_version }}
          path: wheelhouse/*.whl

  slack-notify:
    needs: [build_ubuntu, build_macos]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - uses: shiguredo/github-actions/.github/actions/slack-notify@main
        with:
          status: ${{ job.status }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack_channel: python-oss
          notify_mode: failure_and_fixed
        env:
          GH_TOKEN: ${{ github.token }}

  publish_wheel:
    if: contains(github.ref, 'tags/202')
    needs:
      - build_ubuntu
      - build_macos
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: ubuntu-24.04_x86_64
          - name: ubuntu-24.04_armv8
          - name: macos-26_arm64
        python_version:
          - "3.14"
          - "3.14t"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.platform.name }}_python-${{ matrix.python_version }}
          path: wheelhouse/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          packages-dir: wheelhouse

  create-release:
    if: contains(github.ref, 'tags/202')
    needs:
      - build_ubuntu
      - build_macos
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/

      - name: Create release files list
        run: |
          find artifacts -name "*.whl" -type f > release_files.txt

      - name: Release (Prerelease)
        if: contains(github.ref, 'dev')
        run: |
          gh release create ${{ github.ref_name }} \
            --title "${{ github.ref_name }}" \
            --prerelease \
            $(cat release_files.txt | xargs)
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Release
        if: ${{ !contains(github.ref, 'dev') }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "${{ github.ref_name }}" \
            $(cat release_files.txt | xargs)
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify Release Creation
        run: |
          gh release view ${{ github.ref_name }} --json url
        env:
          GH_TOKEN: ${{ github.token }}

      - if: failure()
        uses: shiguredo/github-actions/.github/actions/slack-notify@main
        with:
          status: ${{ job.status }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack_channel: python-oss
          notify_mode: failure_and_fixed
        env:
          GH_TOKEN: ${{ github.token }}
